version: "3.8"
services:
  postgres_mcp:
    image: crystaldba/postgres-mcp:latest
    environment:
      - DATABASE_URI=postgresql://postgres:Postgres.Otel123@otel-kpi-develop.c5w2242mk993.eu-west-1.rds.amazonaws.com:5432/otel_db_test
    command: ["--access-mode=restricted","--transport=sse"]
    expose:
      - "9000"
    networks: [appnet]

  oauth2_proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    environment:
      - OAUTH2_PROXY_PROVIDER=github
      - OAUTH2_PROXY_CLIENT_ID=${GITHUB_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${COOKIE_SECRET}
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_UPSTREAMS=http://postgres_mcp:9000
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
      - OAUTH2_PROXY_SET_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_REDIRECT_URL=https://mcp.otelai.com/oauth2/callback
    expose:
      - "4180"
    networks: [appnet]

networks:
  appnet: {}
